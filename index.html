<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sieve of Eratosthenes & Prime Gap Analyzer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --prime: #10b981;
      --composite: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #475569;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; color: var(--accent); }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 6px;
      width: 100px;
    }
    button {
      background: var(--accent);
      border: none;
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 6px;
      margin-bottom: 2rem;
      max-height: 300px;
      overflow-y: auto;
      padding: 0.5rem;
      background: var(--bg);
      border-radius: 8px;
    }
    .cell {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--composite);
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--muted);
    }
    .cell.prime {
      background: var(--prime);
      color: #000;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-card h3 { margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--muted); }
    .stat-card p { margin: 0; font-size: 1.25rem; font-weight: bold; }
    
    /* Frequency Chart */
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 150px;
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .bar-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 100%;
      background: var(--accent);
      border-radius: 4px 4px 0 0;
      min-height: 2px;
      transition: height 0.3s ease;
    }
    .bar-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sieve & Prime Gap Analyzer</h1>
    
    <div class="controls">
      <label for="limit">Limit (N):</label>
      <input type="number" id="limit" value="100" min="10" max="10000" />
      <button id="calcBtn">Calculate</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <h3>TOTAL PRIMES FOUND</h3>
        <p id="totalPrimes">0</p>
      </div>
      <div class="stat-card">
        <h3>LARGEST GAP</h3>
        <p id="maxGap">0</p>
      </div>
      <div class="stat-card">
        <h3>MOST COMMON GAP</h3>
        <p id="modeGap">N/A</p>
      </div>
    </div>

    <strong>Number Grid</strong>
    <div class="grid" id="grid"></div>

    <strong>Prime Gap Frequency Distribution</strong>
    <div class="chart" id="chart"></div>
  </div>

  <footer>
    <p>Explore more interactive numerical experiments at <a href="https://outbacksams.com" target="_blank" rel="noopener noreferrer">Outback Sams</a>.</p>
  </footer>

  <script>
    function runSieve(limit) {
      const isPrime = new Array(limit + 1).fill(true);
      isPrime[0] = isPrime[1] = false;

      for (let p = 2; p * p <= limit; p++) {
        if (isPrime[p]) {
          for (let i = p * p; i <= limit; i += p) {
            isPrime[i] = false;
          }
        }
      }

      const primes = [];
      for (let i = 2; i <= limit; i++) {
        if (isPrime[i]) primes.push(i);
      }

      return { isPrime, primes };
    }

    function analyzeGaps(primes) {
      const gaps = {};
      let maxGap = 0;

      for (let i = 1; i < primes.length; i++) {
        const gap = primes[i] - primes[i - 1];
        gaps[gap] = (gaps[gap] || 0) + 1;
        if (gap > maxGap) maxGap = gap;
      }

      let modeGap = "N/A";
      let maxFreq = 0;
      for (const [gap, count] of Object.entries(gaps)) {
        if (count > maxFreq) {
          maxFreq = count;
          modeGap = gap;
        }
      }

      return { gaps, maxGap, modeGap };
    }

    function updateUI() {
      const limit = parseInt(document.getElementById('limit').value, 10);
      const { isPrime, primes } = runSieve(limit);
      const { gaps, maxGap, modeGap } = analyzeGaps(primes);

      // Update Stats
      document.getElementById('totalPrimes').textContent = primes.length;
      document.getElementById('maxGap').textContent = maxGap;
      document.getElementById('modeGap').textContent = modeGap !== "N/A" ? `${modeGap} (x${gaps[modeGap]})` : "N/A";

      // Render Grid
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 1; i <= limit; i++) {
        const cell = document.createElement('div');
        cell.className = `cell ${isPrime[i] ? 'prime' : ''}`;
        cell.textContent = i;
        grid.appendChild(cell);
      }

      // Render Chart
      const chart = document.getElementById('chart');
      chart.innerHTML = '';
      const sortedGaps = Object.keys(gaps).map(Number).sort((a, b) => a - b);
      const maxCount = Math.max(...Object.values(gaps), 1);

      sortedGaps.forEach(gap => {
        const count = gaps[gap];
        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${(count / maxCount) * 100}%`;
        bar.title = `Gap ${gap}: ${count} occurrences`;

        const label = document.createElement('div');
        label.className = 'bar-label';
        label.textContent = gap;

        barContainer.appendChild(bar);
        barContainer.appendChild(label);
        chart.appendChild(barContainer);
      });
    }

    document.getElementById('calcBtn').addEventListener('click', updateUI);
    updateUI();
  </script>
</body>
</html>
